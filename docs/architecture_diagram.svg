<svg width="100%" viewBox="0 0 680 588" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SentryAI analysis pipeline and threat-intel network</title>
<desc>An untrusted email flows top to bottom through six local analysis stages: header auth, content scan, IOC extraction, MITRE mapping, scoring, and verdict. Stage 3 reaches out over the internet through a browser driver to abuseipdb, virustotal, greynoise and whois. Stage 4 reads from a MITRE ATT&CK knowledge store.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.box{fill:#f4f4f5;stroke:#d4d4d8;stroke-width:0.5}
.s-blue{fill:#e6effb;stroke:#9bc0ec}.s-teal{fill:#e2f5f3;stroke:#8fd6cd}
.s-purple{fill:#efe9fb;stroke:#bda9ea}.s-green{fill:#e6f5ea;stroke:#9bd6ab}.s-gray{fill:#f0f0f1;stroke:#cfcfd4}
.t{font:500 14px sans-serif;fill:#1b1b1f}.ts{font:400 12px sans-serif;fill:#52525b}
.arr{stroke:#888;stroke-width:1.5;fill:none}
</style>
</defs>

<rect x="350" y="150" width="290" height="200" rx="8" fill="none" stroke="#bdbdbd" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="495" y="166" text-anchor="middle">External threat intel · internet</text>

<line class="arr" x1="180" y1="90" x2="180" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="166" x2="180" y2="190" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="238" x2="180" y2="262" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="310" x2="180" y2="334" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="382" x2="180" y2="406" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="454" x2="180" y2="478" marker-end="url(#arrow)"/>
<line class="arr" x1="290" y1="287" x2="363" y2="287" marker-end="url(#arrow)"/>
<line class="arr" x1="495" y1="284" x2="513" y2="187" marker-end="url(#arrow)"/>
<line class="arr" x1="495" y1="286" x2="513" y2="229" marker-end="url(#arrow)"/>
<line class="arr" x1="495" y1="289" x2="513" y2="271" marker-end="url(#arrow)"/>
<line class="arr" x1="495" y1="291" x2="513" y2="313" marker-end="url(#arrow)"/>
<line class="arr" x1="360" y1="373" x2="292" y2="361" marker-end="url(#arrow)"/>

<g><rect class="box s-gray" x="70" y="48" width="220" height="42" rx="8"/><text class="t" x="180" y="68" text-anchor="middle">Untrusted email</text><text class="ts" x="180" y="83" text-anchor="middle">tagged · never executed</text></g>
<g><rect class="box s-blue" x="70" y="120" width="220" height="46" rx="8"/><text class="t" x="180" y="140" text-anchor="middle">Stage 1 · Header auth</text><text class="ts" x="180" y="156" text-anchor="middle">SPF · DKIM · DMARC</text></g>
<g><rect class="box s-blue" x="70" y="192" width="220" height="46" rx="8"/><text class="t" x="180" y="212" text-anchor="middle">Stage 2 · Content scan</text><text class="ts" x="180" y="228" text-anchor="middle">urgency · lures · injection</text></g>
<g><rect class="box s-blue" x="70" y="264" width="220" height="46" rx="8"/><text class="t" x="180" y="284" text-anchor="middle">Stage 3 · IOC extraction</text><text class="ts" x="180" y="300" text-anchor="middle">IPs · URLs · domains</text></g>
<g><rect class="box s-blue" x="70" y="336" width="220" height="46" rx="8"/><text class="t" x="180" y="356" text-anchor="middle">Stage 4 · MITRE mapping</text><text class="ts" x="180" y="372" text-anchor="middle">ATT&amp;CK + ATLAS</text></g>
<g><rect class="box s-blue" x="70" y="408" width="220" height="46" rx="8"/><text class="t" x="180" y="428" text-anchor="middle">Stage 5 · Scoring</text><text class="ts" x="180" y="444" text-anchor="middle">risk score · thresholds</text></g>
<g><rect class="box s-green" x="70" y="480" width="220" height="46" rx="8"/><text class="t" x="180" y="500" text-anchor="middle">Stage 6 · Verdict</text><text class="ts" x="180" y="516" text-anchor="middle">structured JSON</text></g>

<g><rect class="box s-teal" x="365" y="265" width="130" height="44" rx="8"/><text class="t" x="430" y="285" text-anchor="middle">Browser driver</text><text class="ts" x="430" y="300" text-anchor="middle">live web lookups</text></g>
<g><rect class="box s-teal" x="515" y="170" width="115" height="34" rx="8"/><text class="ts" x="572" y="191" text-anchor="middle">abuseipdb.com</text></g>
<g><rect class="box s-teal" x="515" y="212" width="115" height="34" rx="8"/><text class="ts" x="572" y="233" text-anchor="middle">virustotal.com</text></g>
<g><rect class="box s-teal" x="515" y="254" width="115" height="34" rx="8"/><text class="ts" x="572" y="275" text-anchor="middle">greynoise.io</text></g>
<g><rect class="box s-teal" x="515" y="296" width="115" height="34" rx="8"/><text class="ts" x="572" y="317" text-anchor="middle">whois</text></g>
<g><rect class="box s-purple" x="360" y="356" width="150" height="44" rx="8"/><text class="t" x="435" y="376" text-anchor="middle">MITRE ATT&amp;CK</text><text class="ts" x="435" y="391" text-anchor="middle">RAG technique store</text></g>

<g><rect class="box s-blue" x="60" y="548" width="13" height="13" rx="3"/></g><text class="ts" x="78" y="558">Analysis stage</text>
<g><rect class="box s-teal" x="192" y="548" width="13" height="13" rx="3"/></g><text class="ts" x="210" y="558">External intel</text>
<g><rect class="box s-purple" x="316" y="548" width="13" height="13" rx="3"/></g><text class="ts" x="334" y="558">Knowledge store</text>
<g><rect class="box s-green" x="456" y="548" width="13" height="13" rx="3"/></g><text class="ts" x="474" y="558">Verdict</text>
<g><rect class="box s-gray" x="536" y="548" width="13" height="13" rx="3"/></g><text class="ts" x="554" y="558">Untrusted input</text>
</svg>
